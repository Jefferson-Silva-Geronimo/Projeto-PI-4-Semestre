name: petshop-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # hot reload: alterações em src/ e prisma/ refletem no container
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  pgdata:
