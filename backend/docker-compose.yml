name: petshop-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env.local

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.local

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  pgdata: